# Waitless MQTT broker — local development configuration.
#
# LOCAL DEV ONLY: anonymous access is enabled so the hardware simulator and the
# API gateway work without credentials. Phase 9 replaces this with per-device
# username/password plus ACLs (see docs/hardware/contract.md).

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

# Keep the log readable while developing.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

persistence true
persistence_location /mosquitto/data/

max_queued_messages 1000
message_size_limit 8192
